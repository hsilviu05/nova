# Alembic configuration.
#
# The database URL is NOT stored here. It is resolved at runtime from
# NOVA_DATABASE__* environment variables in alembic/env.py, so credentials
# never enter version control.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# UTC-prefixed revision filenames so migrations sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
