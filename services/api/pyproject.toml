[project]
name = "nova-api"
version = "0.1.0"
description = "NOVA backend API — a local-first personal AI terminal"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework and ASGI server.
    # FastAPI 0.116 capped starlette below 0.49, which made every patched
    # starlette unreachable -- see the floor below. 0.141 drops the cap.
    "fastapi>=0.141,<0.150",
    "uvicorn[standard]>=0.34,<0.36",
    # Starlette arrives with FastAPI, but NOVA imports it directly --
    # middleware bases, BackgroundTask, WebSocketState. A package the code
    # imports is a dependency of the code, regardless of what pulls it in.
    #
    # The floor is a security floor, not a preference: 0.48 carries six
    # known advisories (PYSEC-2026-161, -248, -249, -1942, -2280, -2281) and
    # the highest fix among them is 1.3.1. If a future FastAPI re-caps
    # starlette below this, resolution fails loudly rather than quietly
    # installing a vulnerable version.
    "starlette>=1.3.1,<2",
    # Validation and configuration. pydantic-settings gives typed, validated
    # env parsing; os.environ alone gives neither.
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    # Persistence. asyncpg is the async driver; a sync driver would block the
    # event loop on every query.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    # pgvector supplies the SQLAlchemy Vector column type the memories table
    # is built on. A runtime dependency, not a dev one: nova.models.memory
    # imports it, so the app does not start without it.
    "pgvector>=0.3,<0.6",
    # Redis for rate limiting and ephemeral state. redis-py ships asyncio.
    "redis>=5.2,<7",
    # HTTP client. A runtime dependency in its own right, not a transitive
    # one: the Ollama adapter, the OpenAI-compatible adapter, the GitHub
    # tools and the project health checks all import it directly.
    #
    # For a while it was only in the dev extras, so the tests had it and the
    # production image did not -- the API failed at import with
    # ModuleNotFoundError while every test stayed green. It also arrives with
    # the Anthropic SDK, which is the other reason it must be declared here:
    # dropping that SDK would otherwise break four unrelated modules for no
    # visible reason.
    "httpx>=0.28,<0.29",
    # The Anthropic SDK, imported by the single adapter that talks to it.
    # Optional as a *provider* -- the default is local -- but a runtime
    # dependency as a module, because the registry imports it when it is
    # built rather than when a key is set.
    "anthropic>=1.0,<2",
    # Security. argon2id is the OWASP first-choice password KDF; PyJWT signs
    # and verifies the access tokens.
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    # Structured logging with contextvar-bound request IDs.
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
    # 9.0.3 is the fix for PYSEC-2026-1845.
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<8",
    # The Anthropic SDK builds its errors from httpx2 objects, and the
    # provider tests construct those directly to exercise the failure paths.
    # Declared rather than leaned on transitively: if the SDK changes HTTP
    # client, this should fail loudly here, not mysteriously in a test.
    "httpx2>=2,<3",
    "ruff>=0.8,<0.15",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # async correctness
    "S",        # bandit security
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "B008",  # function call in default arg — this is how FastAPI Depends works
]

[tool.ruff.lint.per-file-ignores]
# assert is what pytest is built on. Scoped to tests rather than ignored
# globally: `python -O` strips asserts, so one in src/ standing in for a
# check is a real bug, and the global ignore was hiding that.
"tests/*" = ["S101", "S105", "S106"]  # hardcoded test passwords are intentional
"scripts/*" = ["S101"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["nova"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Fixtures and tests must share one event loop: the session-scoped engine and
# Redis client hold connections bound to the loop that created them, and a
# per-test loop would make every one of them "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL and Redis",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["nova"]
branch = true
# SQLAlchemy's asyncio layer resumes coroutines inside greenlets. Without
# this, every line after the first `await` on a repository call is reported
# unexecuted, which understated services/auth.py by roughly half.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Every statement in src/nova is executed by the suite. The floor is 99
# rather than 100 because two branch arcs -- the natural exit of the
# candidate loop in services/memory.py and the fall-through after a
# `confirm` event in api/v1/conversations.py -- are recorded when their
# tests run alone and dropped when the whole suite runs. Both are
# exercised; `concurrency = ["greenlet", "thread"]` above is the cost of
# measuring anything at all through SQLAlchemy's asyncio layer, and losing
# the occasional arc is part of that cost. A real regression takes the
# number well below this.
fail_under = 99
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
