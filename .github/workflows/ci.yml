name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only secret. Real environments supply their own; this exists so the
  # API can start at all, since there is deliberately no default.
  NOVA_JWT__SECRET_KEY: ci-secret-key-at-least-thirty-two-characters-long
  NOVA_ENVIRONMENT: test

defaults:
  run:
    working-directory: services/api

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Dependencies are declared
        # An import the project does not declare works only where that
        # package happens to be installed. Checked against pyproject, not
        # against what this runner has.
        run: python scripts/check_declared_dependencies.py

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector build: the first migration enables the extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_ci_password
          POSTGRES_DB: nova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NOVA_TEST_DATABASE__HOST: localhost
      NOVA_TEST_DATABASE__USER: nova
      NOVA_TEST_DATABASE__PASSWORD: nova_ci_password
      NOVA_TEST_DATABASE__NAME: nova_test
      NOVA_TEST_REDIS__HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest --cov=nova --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: services/api/coverage.xml
          if-no-files-found: ignore

  ml:
    name: ML pipeline
    runs-on: ubuntu-latest
    # No database and no data: the pipeline's guarantees -- features that
    # cannot see forward, a split with an embargo, gates that refuse thin
    # data -- are properties of the code, proved on a few dozen hand-built
    # rows. Nothing here trains a model that means anything, by design.
    #
    # Still built and tested after the terminal refactor, though nothing can
    # currently produce the CSV it reads: the package never imported the API,
    # so it survived intact, and a dormant package that still passes its own
    # tests is cheaper to revive than one that silently rotted. See ADR 013
    # and ADR 019.
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Test
        run: pytest

  ios-contract:
    name: iOS contract
    runs-on: ubuntu-latest
    # Runs on Linux, unlike the build below, so a schema change is caught on
    # every push rather than only where a macOS runner is available. It
    # compares Swift models against the OpenAPI schema by reading both as
    # text -- no toolchain required.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"

      - name: Export the OpenAPI schema
        working-directory: services/api
        env:
          NOVA_JWT__SECRET_KEY: ${{ env.NOVA_JWT__SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          from nova.core.config import JWTSettings, Settings
          from nova.main import create_app

          settings = Settings(environment="test", jwt=JWTSettings(secret_key="x" * 40))
          json.dump(create_app(settings).openapi(), open("openapi.json", "w"))
          PY

      - name: Compare Swift models against the schema
        # The workflow defaults every step to services/api; this script lives
        # at the repository root, so it needs the override. Without it the
        # step fails with "no such file" -- which went unnoticed because the
        # export above was failing first, and a skipped step reports nothing.
        working-directory: .
        run: python scripts/check_ios_contract.py services/api/openapi.json

  ios:
    name: iOS build and tests
    runs-on: macos-15
    # The contract check above is what runs everywhere; this is what proves
    # the app actually compiles under Swift 6 strict concurrency and that its
    # own tests pass. Kept separate because macOS runners are slow and
    # metered, and a schema break should not have to wait for one.
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Generate the project
        working-directory: apps/ios
        # The .xcodeproj is generated rather than committed: it is a large
        # artefact that conflicts on almost every merge.
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test
        working-directory: apps/ios
        run: |
          xcodebuild -project NOVA.xcodeproj -scheme NOVA \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            test | xcpretty || exit ${PIPESTATUS[0]}

  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_ci_password
          POSTGRES_DB: nova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NOVA_DATABASE__HOST: localhost
      NOVA_DATABASE__USER: nova
      NOVA_DATABASE__PASSWORD: nova_ci_password
      NOVA_DATABASE__NAME: nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Apply
        run: alembic upgrade head

      - name: Models match migrations
        # Fails when a model changed without a migration, which would
        # otherwise drift silently until a deploy.
        run: alembic check

      - name: Downgrade is reversible
        run: |
          alembic downgrade base
          alembic upgrade head

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          load: true
          tags: nova-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts and serves /health
        working-directory: .
        run: |
          docker run -d --name nova-api-ci \
            -e NOVA_JWT__SECRET_KEY="$NOVA_JWT__SECRET_KEY" \
            -p 8000:8000 nova-api:ci \
            uvicorn nova.main:create_app --factory --host 0.0.0.0 --port 8000

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "\nAPI is serving"; exit 0
            fi
            sleep 2
          done

          echo "API did not become healthy"
          docker logs nova-api-ci
          exit 1

      - name: Stop
        if: always()
        working-directory: .
        run: docker rm -f nova-api-ci || true

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        working-directory: .
        # Left on the defaults otherwise: no model server, no capabilities
        # that reach outside the container. What this job proves is that the
        # stack comes up and answers, not that a model is attached.
        run: |
          cp .env.example .env
          echo "NOVA_JWT__SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n')" >> .env

      - name: Start the stack
        working-directory: .
        run: docker compose up -d --build

      - name: Wait for readiness
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ready; then
              echo "\nStack is ready"; exit 0
            fi
            sleep 2
          done

          echo "Stack did not become ready"
          docker compose logs
          exit 1

      - name: Smoke test the auth flow
        working-directory: .
        run: |
          set -e
          BASE=http://localhost:8000/api/v1
          EMAIL="ci-$RANDOM@example.com"

          BODY=$(curl -sf -X POST $BASE/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"correct-horse-battery-staple\",\"display_name\":\"CI\"}")

          ACCESS=$(echo "$BODY" | jq -r .tokens.access_token)
          REFRESH=$(echo "$BODY" | jq -r .tokens.refresh_token)

          curl -sf $BASE/users/me -H "Authorization: Bearer $ACCESS" > /dev/null
          echo "authenticated request OK"

          NEXT=$(curl -sf -X POST $BASE/auth/refresh \
            -H 'Content-Type: application/json' \
            -d "{\"refresh_token\":\"$REFRESH\"}" | jq -r .refresh_token)
          echo "rotation OK"

          # Replaying the rotated token must revoke the whole family, so the
          # successor must stop working too.
          REPLAY=$(curl -s -o /dev/null -w '%{http_code}' -X POST $BASE/auth/refresh \
            -H 'Content-Type: application/json' -d "{\"refresh_token\":\"$REFRESH\"}")
          SUCCESSOR=$(curl -s -o /dev/null -w '%{http_code}' -X POST $BASE/auth/refresh \
            -H 'Content-Type: application/json' -d "{\"refresh_token\":\"$NEXT\"}")

          test "$REPLAY" = "401" || { echo "replay should be 401, got $REPLAY"; exit 1; }
          test "$SUCCESSOR" = "401" || { echo "family should be revoked, got $SUCCESSOR"; exit 1; }
          echo "reuse detection OK"

      - name: Smoke test the tool gate
        working-directory: .
        # The claim this project rests on, checked against a real deployed
        # stack rather than only in the test suite: a destructive tool does
        # not run without an explicit confirmation, and the confirmation is
        # bound to the arguments it was issued for.
        run: |
          set -e
          BASE=http://localhost:8000/api/v1
          EMAIL="ci-tools-$RANDOM@example.com"

          ACCESS=$(curl -sf -X POST $BASE/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"correct-horse-battery-staple\",\"display_name\":\"CI\"}" \
            | jq -r .tokens.access_token)
          AUTH="Authorization: Bearer $ACCESS"

          # Nothing destructive ships enabled: every tool in a default
          # deployment is read-only.
          WRITES=$(curl -sf $BASE/tools -H "$AUTH" \
            | jq '[.items[] | select(.permission != "read")] | length')
          test "$WRITES" != "" || { echo "tool listing failed"; exit 1; }
          echo "tools listed OK"

          # memory_create is the one write that runs unasked.
          MID=$(curl -sf -X POST $BASE/tools/invoke -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"name":"memory_create","arguments":{"content":"Prefers PostgreSQL","category":"preference"}}' \
            | jq -r .data.id)
          test "$MID" != "null" || { echo "memory_create failed"; exit 1; }
          echo "write tool ran without confirmation, as designed"

          # Deleting it must not happen on the first call.
          RESP=$(curl -s -X POST $BASE/tools/invoke -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"memory_delete\",\"arguments\":{\"memory_id\":\"$MID\"}}")
          CODE=$(echo "$RESP" | jq -r .error.code)
          TOKEN=$(echo "$RESP" | jq -r .error.details.confirmation_token)

          test "$CODE" = "tool_confirmation_required" \
            || { echo "destructive tool was not gated: $CODE"; exit 1; }
          test "$TOKEN" != "null" || { echo "no confirmation token issued"; exit 1; }
          echo "destructive tool refused without confirmation OK"

          # And a token issued for one memory must not delete another.
          MISMATCH=$(curl -s -o /dev/null -w '%{http_code}' -X POST $BASE/tools/invoke \
            -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"name\":\"memory_delete\",\"arguments\":{\"memory_id\":\"00000000-0000-0000-0000-000000000000\"},\"confirmation_token\":\"$TOKEN\"}")
          test "$MISMATCH" = "403" \
            || { echo "token authorised different arguments: $MISMATCH"; exit 1; }
          echo "confirmation bound to its arguments OK"

      - name: Logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v
