# XcodeGen spec.
#
#   brew install xcodegen
#   xcodegen generate
#   open NOVA.xcodeproj
#
# The project file is generated rather than committed: an .xcodeproj is a
# large generated artefact that conflicts on almost every merge, and this
# file says the same thing in twenty readable lines.
#
# If you would rather not install XcodeGen, create an iOS App target named
# NOVA in Xcode and add the NOVA/ directory to it — the sources have no
# dependency on this file.

name: NOVA

options:
  bundleIdPrefix: com.nova
  deploymentTarget:
    # Independent of the SDK: App Store Connect requires building against the
    # iOS 26 SDK, while nothing in this app needs anything newer than 18.
    # @Observable needs 17+, Swift Charts 16+.
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Strict concurrency is the point of adopting Swift 6 at all; the token
    # store and API client are actors precisely so this passes.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  NOVA:
    type: application
    platform: iOS
    sources:
      - path: NOVA
        # Excluded because `INFOPLIST_FILE` below already points at it. Left
        # in the source list it is *also* copied in as a resource, and the
        # bundle ends up with a second "Info 2.plist" holding an unexpanded
        # $(INFOPLIST_KEY_NOVABaseURL) and only half the ATS block. Harmless
        # at runtime, rejected by App Store validation, and confusing to
        # anyone who opens the built app.
        excludes:
          - Info.plist
    dependencies:
      # Linked explicitly. `import AppIntents` alone compiles, but without
      # the framework on the link line `appintentsmetadataprocessor` skips
      # extraction -- no Metadata.appintents in the bundle, so the two Siri
      # phrases in the README register with nothing and silently do nothing.
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nova.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          # The simulator talking to a server on the development machine.
          # Cleartext to localhost only; see the ATS exception below.
          INFOPLIST_KEY_NOVABaseURL: http://127.0.0.1:8000
        Release:
          INFOPLIST_KEY_NOVABaseURL: ""
    info:
      path: NOVA/Info.plist
      properties:
        NOVABaseURL: $(INFOPLIST_KEY_NOVABaseURL)
        NSAppTransportSecurity:
          # NOVA runs on a Mac on the same Wi-Fi, reached at a private
          # address over plain HTTP. NSAllowsLocalNetworking permits exactly
          # that -- RFC 1918 addresses, link-local, .local names and
          # unqualified hostnames -- and nothing else. Notably NOT
          # NSAllowsArbitraryLoads: cleartext to the open internet stays
          # blocked, which is why ServerSettings refuses to save an http://
          # address that is not on a local network rather than letting the
          # request fail later with nothing to act on.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        # iOS 14+ requires an explicit reason before an app may reach other
        # devices on the local network at all.
        NSLocalNetworkUsageDescription: >-
          NOVA connects to the server running on your own Mac or home server,
          so your conversations and memories never leave your network.
        NSMicrophoneUsageDescription: >-
          NOVA uses the microphone only while you hold the microphone button,
          to turn what you say into text you can check before sending.
        NSSpeechRecognitionUsageDescription: >-
          NOVA turns speech into text on this device where possible, so you
          can talk to it instead of typing.

  NOVATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NOVATests
    settings:
      base:
        # Generated rather than committed: a test bundle's Info.plist has no
        # content worth reviewing, and without one the bundle cannot be code
        # signed for the simulator.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nova.app.tests
    dependencies:
      - target: NOVA
