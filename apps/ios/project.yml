# XcodeGen spec.
#
#   brew install xcodegen
#   xcodegen generate
#   open NOVA.xcodeproj
#
# The project file is generated rather than committed: an .xcodeproj is a
# large generated artefact that conflicts on almost every merge, and this
# file says the same thing in twenty readable lines.
#
# If you would rather not install XcodeGen, create an iOS App target named
# NOVA in Xcode and add the NOVA/ directory to it — the sources have no
# dependency on this file.

name: NOVA

options:
  bundleIdPrefix: com.hermeneanu
  deploymentTarget:
    # Independent of the SDK: App Store Connect requires building against the
    # iOS 26 SDK, while nothing in this app needs anything newer than 18.
    # @Observable needs 17+, Swift Charts 16+.
    iOS: "18.0"
  createIntermediateGroups: true

# Xcode compares this against its own version and offers "Update to
# recommended settings" whenever it is older. XcodeGen's default is 1430
# (Xcode 14.3), so the prompt appeared on every open -- and accepting it
# writes into the .xcodeproj, which `xcodegen generate` then discards. The
# five settings it actually wanted are in `settings.base` below; this records
# that they have been applied.
attributes:
  LastUpgradeCheck: "2700"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Strict concurrency is the point of adopting Swift 6 at all; the token
    # store and API client are actors precisely so this passes.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

    # Xcode 27's recommended baseline, for the five settings XcodeGen does
    # not already match. Compared against
    # Templates/Project Templates/Base/Base_ProjectSettings.xctemplate rather
    # than guessed at; the other 38 are already correct.
    #
    # Nothing here changes what is compiled today -- NOVA is pure Swift, so
    # the C and C++ standards and the 64-to-32-bit warning apply to no source
    # file in the target. They are set because they are the baseline a new
    # project gets, and because the first C dependency that ever lands should
    # arrive under them rather than under a 2014 default.
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    # Generates typed Swift symbols for asset catalog entries, so a colour or
    # an icon is `.accent` rather than a string literal. Inert until the app
    # gains an asset catalog -- which it needs anyway, since it currently
    # installs with a blank icon.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # String catalogs rather than .strings files, if this is ever localised.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  NOVA:
    type: application
    platform: iOS
    sources:
      - path: NOVA
        # Excluded because `INFOPLIST_FILE` below already points at it. Left
        # in the source list it is *also* copied in as a resource, and the
        # bundle ends up with a second "Info 2.plist" holding an unexpanded
        # $(INFOPLIST_KEY_NOVABaseURL) and only half the ATS block. Harmless
        # at runtime, rejected by App Store validation, and confusing to
        # anyone who opens the built app.
        excludes:
          - Info.plist
    dependencies:
      # Linked explicitly. `import AppIntents` alone compiles, but without
      # the framework on the link line `appintentsmetadataprocessor` skips
      # extraction -- no Metadata.appintents in the bundle, so the two Siri
      # phrases in the README register with nothing and silently do nothing.
      - sdk: AppIntents.framework
    settings:
      base:
        # Namespaced to the developer rather than the product. `com.nova.app`
        # is a name nobody owns, and Apple will refuse to register it to a
        # team that has not claimed it.
        PRODUCT_BUNDLE_IDENTIFIER: com.hermeneanu.nova
        # Set here rather than only in Xcode's UI: Xcode writes the team into
        # the .xcodeproj, and `xcodegen generate` overwrites that file -- so
        # signing configured through the UI is silently lost the next time
        # anybody regenerates.
        DEVELOPMENT_TEAM: A93FGV7L5Y
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait only: the UI is a five-tab phone layout designed for a
        # phone standing in a dock, and there is no landscape design to ship.
        # The mark from the launch screen, rendered by Tools/make-appicon.swift.
        # Without these the app installs as a blank white tile.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPhone only (1). Xcode defaults to "1,2", which claims iPad -- and
        # an iPad-capable app that does not require full screen must support
        # every orientation, so it can be resized in Split View. That is the
        # "All interface orientations must be supported unless the app
        # requires full screen" validation error. Declaring the truth is the
        # fix: there is no iPad build of this, and UIRequiresFullScreen (the
        # other way out) is deprecated.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          # The simulator talking to a server on the development machine.
          # Cleartext to localhost only; see the ATS exception below.
          INFOPLIST_KEY_NOVABaseURL: http://127.0.0.1:8000
        Release:
          INFOPLIST_KEY_NOVABaseURL: ""
    info:
      path: NOVA/Info.plist
      properties:
        NOVABaseURL: $(INFOPLIST_KEY_NOVABaseURL)
        NSAppTransportSecurity:
          # NOVA runs on a Mac on the same Wi-Fi, reached at a private
          # address over plain HTTP. NSAllowsLocalNetworking permits exactly
          # that -- RFC 1918 addresses, link-local, .local names and
          # unqualified hostnames -- and nothing else. Notably NOT
          # NSAllowsArbitraryLoads: cleartext to the open internet stays
          # blocked, which is why ServerSettings refuses to save an http://
          # address that is not on a local network rather than letting the
          # request fail later with nothing to act on.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        # iOS 14+ requires an explicit reason before an app may reach other
        # devices on the local network at all.
        NSLocalNetworkUsageDescription: >-
          NOVA connects to the server running on your own Mac or home server,
          so your conversations and memories never leave your network.
        NSMicrophoneUsageDescription: >-
          NOVA uses the microphone only while you hold the microphone button,
          to turn what you say into text you can check before sending.
        NSSpeechRecognitionUsageDescription: >-
          NOVA turns speech into text on this device where possible, so you
          can talk to it instead of typing.

  NOVATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NOVATests
    settings:
      base:
        # Generated rather than committed: a test bundle's Info.plist has no
        # content worth reviewing, and without one the bundle cannot be code
        # signed for the simulator.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hermeneanu.nova.tests
        DEVELOPMENT_TEAM: A93FGV7L5Y
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: NOVA
